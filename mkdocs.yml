site_name: AIxPM Watch
site_url: https://jeffused.github.io/aixpm-watch/
site_description: AI at work, weekly — a sourced edition on enterprise AI adoption, consulting, project management and AI novelties.
site_author: Jeff Lavigne
repo_url: https://github.com/jeffused/aixpm-watch
repo_name: jeffused/aixpm-watch

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - toc.follow

plugins:
  - search:
      lang:
        - en
        - fr
  - blog:
      blog_dir: .
      post_dir: posts
      post_url_format: "{date}/{slug}"
      post_date_format: long
      archive: true
      archive_name: Archives
      archive_date_format: yyyy
      categories: true
      categories_name: Catégories
      categories_url_format: "category/{slug}"
      categories_toc: true
      pagination: true
      pagination_per_page: 10
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - footnotes
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jeffused/aixpm-watch
  generator: false

extra_css:
  - stylesheets/aixpm.css

extra_javascript:
  - javascripts/aixpm-store.js
  - javascripts/aixpm-ui.js
  - javascripts/aixpm-library.js
  - javascripts/aixpm-search.js
  - javascripts/aixpm-editions.js

hooks:
  - hooks/categories.py

copyright: AIxPM Watch — curation Jeff Lavigne
